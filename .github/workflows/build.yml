name: Build and release

on:
  push:
    branches:
      - master
    tags:
      - 'V*'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.2.21'
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build:all
      - name: Verify binaries and release version
        shell: bash
        run: |
          version=$(bun -e 'console.log(require("./package.json").version)')
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "V$version" ]]; then
            printf 'Release tag %s must match V%s\n' "$GITHUB_REF_NAME" "$version" >&2
            exit 1
          fi
          for binary in ai-macos-arm64 ai-macos-x64 ai-linux-x64 ai-linux-arm64 ai-win-x64.exe; do
            test -s "dist/$binary"
          done
          for binary in dist/ai-macos-arm64 dist/ai-macos-x64; do
            codesign --force --sign - "$binary"
            codesign --verify --strict "$binary"
          done
          ./dist/ai-macos-arm64 --version | grep -Fx "ai v$version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-binaries
          path: dist/ai-*
          if-no-files-found: error
          overwrite: true

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ai-binaries
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/ai-* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
